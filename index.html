<script src="app.js"></script>

<script>
/* ============================================================
   DIAMOND STORE LOGIN FIX
   Direct connection to Google Apps Script
   ============================================================ */

const DIAMOND_API =
"https://script.google.com/macros/s/AKfycbxUxWm5chmH59VOdnDL4WJgSR0xEKGtkhu8gBZ9VCLxp0-Mj8xbNi1ztGFBy-aYtYw/exec";


/* ============================================================
   LOGIN
   ============================================================ */

window.login = async function () {

    const username =
        document.getElementById("username")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;

    const role =
        document.getElementById("role")
            .value;

    const message =
        document.getElementById("loginMessage");


    if (!username || !password) {

        if (message) {
            message.textContent =
                "Please enter User ID/Username and Password.";
        }

        return;
    }


    if (message) {
        message.textContent =
            "Logging in...";
    }


    try {

        const response =
            await fetch(
                DIAMOND_API,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body: JSON.stringify({

                        action: "login",

                        username:
                            username,

                        password:
                            password,

                        role:
                            role

                    })
                }
            );


        const result =
            await response.json();


        console.log(
            "LOGIN RESPONSE:",
            result
        );


        if (!result.success) {

            if (message) {
                message.textContent =
                    result.message ||
                    "Invalid username, password or role.";
            }

            return;
        }


        /* ====================================================
           SAVE USER
           ==================================================== */

        localStorage.setItem(
            "diamondStoreUser",
            JSON.stringify(result.user)
        );


        /* ====================================================
           UPDATE USER
           ==================================================== */

        const userDisplay =
            document.getElementById(
                "userDisplay"
            );


        if (
            userDisplay &&
            result.user
        ) {

            userDisplay.textContent =
                result.user.fullName +
                " (" +
                result.user.role +
                ")";
        }


        /* ====================================================
           SHOW DASHBOARD
           ==================================================== */

        if (
            typeof showPage ===
            "function"
        ) {

            showPage(
                "dashboardPage"
            );

        } else {

            document
                .querySelectorAll(".page")
                .forEach(function(page) {

                    page.classList.add(
                        "hidden"
                    );

                });


            document
                .getElementById(
                    "dashboardPage"
                )
                .classList.remove(
                    "hidden"
                );
        }


        /* ====================================================
           LOAD DATA
           ==================================================== */

        if (
            typeof loadInventory ===
            "function"
        ) {

            await loadInventory();
        }


        if (
            typeof loadDashboardAnalytics ===
            "function"
        ) {

            await loadDashboardAnalytics();
        }


        if (message) {
            message.textContent =
                "";
        }


    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );


        if (message) {

            message.textContent =
                "Cannot connect to Google Apps Script.";

        }

    }

};


/* ============================================================
   LOGOUT
   ============================================================ */

window.logout = function () {

    localStorage.removeItem(
        "diamondStoreUser"
    );

    localStorage.removeItem(
        "diamondStoreShiftId"
    );

    currentUser = null;

    document
        .querySelectorAll(".page")
        .forEach(function(page) {

            page.classList.add(
                "hidden"
            );

        });


    document
        .getElementById(
            "loginPage"
        )
        .classList.remove(
            "hidden"
        );

};


/* ============================================================
   PAGE NAVIGATION
   ============================================================ */

window.showPage = function (pageId) {

    document
        .querySelectorAll(".page")
        .forEach(function(page) {

            page.classList.add(
                "hidden"
            );

        });


    const page =
        document.getElementById(
            pageId
        );


    if (page) {

        page.classList.remove(
            "hidden"
        );

        window.scrollTo(
            0,
            0
        );
    }

};


/* ============================================================
   INITIAL PAGE
   ============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const saved =
            localStorage.getItem(
                "diamondStoreUser"
            );


        if (saved) {

            try {

                const user =
                    JSON.parse(saved);


                if (typeof currentUser !== "undefined") {
                    currentUser = user;
                }


                const display =
                    document.getElementById(
                        "userDisplay"
                    );


                if (display) {

                    display.textContent =
                        user.fullName +
                        " (" +
                        user.role +
                        ")";
                }


                showPage(
                    "dashboardPage"
                );


            } catch (error) {

                localStorage.removeItem(
                    "diamondStoreUser"
                );

                showPage(
                    "loginPage"
                );
            }

        } else {

            showPage(
                "loginPage"
            );

        }

    }
);

</script>

</body>
</html>
